name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  SA_PASSWORD: "Password123!"

jobs:
  # ==================================================================
  # Build seluruh solusi dan jalankan pengujian.
  #
  # Dua dependensi disediakan di sini karena integration test menyalakan
  # aplikasi yang sesungguhnya:
  #   - SQL Server, untuk migration dan seeder data referensi
  #   - Elasticsearch, karena probe /health/ready ikut memeriksanya
  # ==================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        # Keamanan dimatikan khusus untuk CI: container ini sekali pakai,
        # hanya dapat dijangkau dari dalam runner, dan mematikannya
        # menghilangkan kebutuhan bootstrap user seperti pada stack lokal.
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start SQL Server
        uses: potatoqualitee/mssqlsuite@v1.7
        with:
          install: sqlengine
          sa-password: ${{ env.SA_PASSWORD }}

      - name: Restore
        run: dotnet restore SearchEngine.slnx

      - name: Build
        run: dotnet build SearchEngine.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test SearchEngine.slnx
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
        env:
          # Hanya connection string yang perlu ditimpa. Nilai di
          # appsettings.json memakai Windows Authentication ke localhost,
          # yang tidak berlaku di runner Linux.
          ConnectionStrings__BusinessConnection: "Server=localhost;Database=SearchEngineBusinessDB;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False;"
          ConnectionStrings__IdentityConnection: "Server=localhost;Database=SearchEngineIdentityDB;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False;"
          ConnectionStrings__HangfireConnection: "Server=localhost;Database=SearchEngineHangfireDB;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False;"

          # Kredensial diabaikan karena keamanan dimatikan, tetapi tetap
          # harus terisi agar lolos validasi opsi saat aplikasi start.
          Elasticsearch__Uri: "http://localhost:9200"
          Elasticsearch__Username: "elastic"
          Elasticsearch__Password: "ci-security-disabled"

          # Test host membangun skema dan menanam data referensi sendiri.
          Database__MigrateOnStartup: "true"

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ==================================================================
  # Gerbang mutu kode dan kerentanan dependensi
  # ==================================================================
  code-quality:
    name: Code Quality & Vulnerability Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Solution
        run: dotnet restore SearchEngine.slnx

      - name: Verify Formatting
        run: dotnet format SearchEngine.slnx --verify-no-changes

      - name: Vulnerable Package Scan
        run: |
          OUTPUT=$(dotnet list SearchEngine.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "has the following vulnerable"; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi
          echo "No vulnerable packages found."

  # ==================================================================
  # Analisis statis CodeQL (C#)
  # ==================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # Code scanning memerlukan GitHub Advanced Security, yang tidak tersedia
    # pada repositori privat tanpa lisensi GHAS. Mengunggah hasilnya di sana
    # membuat run gagal, sehingga job ini dilewati pada repo privat dan akan
    # berjalan sendiri begitu repositori dibuat publik.
    if: ${{ github.event.repository.private == false }}

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build Solution
        run: dotnet build SearchEngine.slnx -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
