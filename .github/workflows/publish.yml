name: Publish NuGet Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Mediaine.SearchEngine.Template.csproj

      - name: Build
        run: dotnet build Mediaine.SearchEngine.Template.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Mediaine.SearchEngine.Template.csproj --configuration Release --no-build

      - name: NuGet Login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          # username/profile NuGet kamu
          user: adityapratamaf

      - name: Publish Package
        run: |
          dotnet nuget push "./bin/Release/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json"